<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Team access | Feasted Gaming</title>
  <link rel="icon" href="assets/crest.svg">
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f7f0ff;background:#080b18}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#282044,#080b18 65%)}
    main{width:min(100%,440px);padding:28px;border:1px solid #b58aff55;border-radius:18px;background:#111329;box-shadow:0 20px 60px #0005}
    img{width:52px;height:52px}h1{font-family:Georgia,serif;font-size:1.8rem;color:#f5d27d}p{color:#c0b7d4;line-height:1.6}label{display:block;margin:20px 0 7px;font-weight:600}
    input,button{width:100%;min-height:46px;border-radius:9px;font:inherit;padding:12px}input{border:1px solid #b58aff66;background:#080b18;color:#f7f0ff;min-width:0}
    button{margin-top:24px;border:0;background:linear-gradient(115deg,#75f0d0,#b58aff);color:#111022;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    :focus-visible{outline:3px solid #f5d27d;outline-offset:3px}a{color:#75f0d0}#staffLoginStatus{min-height:1.5em;overflow-wrap:anywhere}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <img src="assets/crest.svg" alt="Feasted Gaming crest">
    <h1>Team sign-in</h1>
    <p>Use your authorized Feasted Gaming staff or admin account.</p>
    <form id="staffLoginForm">
      <label for="staffEmail">Email</label>
      <input id="staffEmail" type="email" autocomplete="username" required maxlength="254">
      <label for="staffPassword">Password</label>
      <input id="staffPassword" type="password" autocomplete="current-password" required>
      <button id="staffLoginButton" type="submit">Sign in to staff tools</button>
    </form>
    <p id="staffLoginStatus" role="status" aria-live="polite"></p>
    <p><a href="index.html">Return to Feasted Gaming</a></p>
  </main>
  <script src="assets/site-config.js"></script>
  <script src="assets/staff-login.js"></script>
</body>
</html>
