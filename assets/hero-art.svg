<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Feasted Gaming: The Arcane Arena</title><desc id="desc">A majestic fantasy citadel rises above a glowing valley, framed by mountains, stars, magical runes, and a radiant portal.</desc>
<defs>
