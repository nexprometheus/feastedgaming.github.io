<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
 <title id="title">Feasted Gaming: Enter the Nexus</title><desc id="desc">A sleek starship crosses a luminous planet above a futuristic city among the stars.</desc>
