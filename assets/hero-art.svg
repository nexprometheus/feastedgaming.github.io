  <radialGradient id="nebula"><stop stop-color="#5c49bb" stop-opacity=".5"/><stop offset="1" stop-color="#081321" stop-opacity="0"/></radialGradient>
  <linearGradient id="planet" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#8df4ff"/><stop offset=".42" stop-color="#338bc2"/><stop offset="1" stop-color="#26346f"/></linearGradient>
  <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f8ff"/><stop offset=".35" stop-color="#9bb8d0"/><stop offset=".68" stop-color="#435e7f"/><stop offset="1" stop-color="#1b2948"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5fbff"/><stop offset="1" stop-color="#4676ae"/></linearGradient>
  <linearGradient id="city" x2="0" y2="1"><stop stop-color="#1d4d80"/><stop offset="1" stop-color="#0b1529"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
