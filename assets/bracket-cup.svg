<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Tournament bracket and trophy</title>
<desc id="desc">A glowing eight-player tournament bracket leads to a gold champion's cup.</desc>
